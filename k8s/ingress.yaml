apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuropharm-ingress
  namespace: neuropharm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: neuropharm-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - neuropharm.example.com
      secretName: neuropharm-tls
  rules:
    - host: neuropharm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuropharm-app
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: neuropharm-headers
  namespace: neuropharm
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    customResponseHeaders:
      X-Powered-By: ""
